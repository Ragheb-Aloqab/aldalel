<head>
<meta charset="UTF-8">

<title>الدليل الرقمي التجاري — إعادة تصميم</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#EFF3F8;
    --panel:#FFFFFF;
    --panel2:#E7EEF6;
    --amber:#E5700B;
    --amber-dim:#F6B979;
    --cyan:#15A24A;
    --cyan-dim:#8EE0AE;
    --sand:#132845;
    --muted:#5C7089;
    --hairline:rgba(19,40,69,0.10);
    --frame-shadow:0 0 0 2px rgba(19,40,69,.06), 0 40px 90px -30px rgba(0,0,0,.25);
  }
  *{font-family:'Tajawal',sans-serif;}
  html,body{background:var(--ink);}
  ::-webkit-scrollbar{display:none;}
  *{scrollbar-width:none;}

  .bg-ink{background:var(--ink);}
  .bg-panel{background:var(--panel);}
  .bg-panel2{background:var(--panel2);}
  .text-sand{color:var(--sand);}
  .text-muted{color:var(--muted);}
  .text-amber{color:var(--amber);}
  .text-cyan{color:var(--cyan);}
  .border-hair{border-color:var(--hairline);}

  .glow-amber{box-shadow:0 1px 2px rgba(14,35,64,.05), 0 10px 22px -14px rgba(0,0,0,.35);}
  .glow-cyan{box-shadow:0 1px 2px rgba(14,35,64,.05), 0 10px 22px -14px rgba(0,0,0,.35);}
  .neon-amber{color:var(--amber);}
  .neon-cyan{color:var(--cyan);}

  /* signature: five-colour spine accent, echoing the directory's book mark */
  .spine-0{border-inline-start:4px solid #8B5FA6;}
  .spine-1{border-inline-start:4px solid #EC4899;}
  .spine-2{border-inline-start:4px solid #F4B400;}
  .spine-3{border-inline-start:4px solid #7CB518;}
  .spine-4{border-inline-start:4px solid #E64545;}

  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(.75);}}
  .live-dot{animation:pulseDot 1.6s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){
    .live-dot{animation:none !important;}
    *{transition:none !important;}
  }

  .fade-in{animation:fadeIn .28s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .stamp{
    border:1.5px dashed color-mix(in srgb, var(--amber) 55%, transparent);
    background:radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--amber) 18%, transparent), transparent 60%), var(--panel2);
  }

  .phone-frame{
    width:390px; max-width:94vw; height:844px; max-height:92vh;
    border-radius:2.75rem;
    background:#050709;
    border:10px solid #05070a;
    box-shadow:var(--frame-shadow);
    position:relative; overflow:hidden;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:126px; height:22px; background:#05070a; border-radius:0 0 16px 16px; z-index:40;
  }

  .tab-underline{position:relative;}
  .tab-underline.active::after{
    content:''; position:absolute; bottom:-9px; right:0; left:0; height:2px;
    background:linear-gradient(90deg, var(--amber), var(--cyan));
    border-radius:2px;
  }

  .card-tile{transition:transform .18s ease, box-shadow .18s ease;}
  .card-tile:active{transform:scale(.97);}

  .navbtn{transition:color .15s ease;}
</style>
</head>
<body class="bg-ink min-h-screen flex items-center justify-center py-10 px-3 relative overflow-x-hidden">

          <div class="flex items-center justify-between">

              </button>
            </div>
            <h2 id="screenTitle" class="text-sand font-extrabold text-[15px]">الرئيسية</h2>

        </header>

        </nav>

function icon(name, cls){ return `<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.sparkle}</svg>`; }

/* ---------------- state ---------------- */
let stack = [{type:'home'}];
let favorites = new Set();
let visitorCount = 927;

function current(){ return stack[stack.length-1]; }
function push(screen){ stack.push(screen); render(); }
function pop(){ if(stack.length>1){ stack.pop(); render(); } }
function goNav(type){ stack = [{type}]; render(); }

document.querySelectorAll('[data-nav]').forEach(b=>{
  b.addEventListener('click', ()=> goNav(b.dataset.nav));
});
document.getElementById('backBtn').addEventListener('click', pop);

/* ---------------- card builders ---------------- */
const SPINES = ['#8B5FA6','#EC4899','#F4B400','#7CB518','#E64545'];
function tile(title, iconName, onclick, i, sub){
  const c = SPINES[i % SPINES.length];
  return `
  <button onclick="${onclick}" class="card-tile spine-${i % SPINES.length} bg-panel2 rounded-2xl border border-hair p-4 flex flex-col items-start gap-3 text-right w-full">
    <div class="w-11 h-11 rounded-xl bg-ink/60 flex items-center justify-center" style="color:${c}">
      ${icon(iconName,'w-5 h-5')}
    </div>
    <div>
      <p class="text-sand font-bold text-[13px] leading-snug">${title}</p>
      ${sub? `<p class="text-muted text-[11px] mt-0.5">${sub}</p>`:''}
    </div>
  </button>`;
}

function storeCard(store, i){
  const fav = favorites.has(store.id);
  const c = SPINES[(i ?? store.id) % SPINES.length];
  return `
  <div class="bg-panel2 rounded-2xl border border-hair p-3.5 flex items-center gap-3">
    <div class="w-14 h-14 shrink-0 rounded-xl flex items-center justify-center font-black text-lg bg-ink/60 border border-hair" style="color:${c}">
      ${store.name.trim()[0]}
    </div>
    <button onclick="openStore(${store.id})" class="flex-1 text-right min-w-0">
      <p class="text-sand font-extrabold text-[13.5px] truncate">${store.name}</p>
      <p class="text-muted text-[11px] mt-1 truncate">${store.region}</p>
    </button>
    <div class="flex flex-col items-center gap-2">
      <span class="stamp rounded-full w-12 h-12 flex flex-col items-center justify-center text-amber">
        <span class="text-[11px] font-black leading-none">${store.visitors}</span>
        <span class="text-[7px] text-muted leading-none mt-0.5">زائر</span>
      </span>
      <button onclick="toggleFav(${store.id}, event)" class="text-cyan">
        ${icon('heart', 'w-4 h-4 ' + (fav? 'fill-current':''))}
      </button>
    </div>
  </div>`;
}
function toggleFav(id, e){
  e.stopPropagation();
  favorites.has(id)? favorites.delete(id) : favorites.add(id);
  render();
}
function openStore(id){ push({type:'storedetail', id}); }

/* ---------------- screens ---------------- */
function screenHome(){
  const q = (document.getElementById('searchInput')?.value || '').trim();
  const items = HOME_ORDER.filter(k => !q || CATS[k].title.includes(q));
  return `
  <div class="fade-in">
    <div class="rounded-2xl overflow-hidden relative mb-4 h-32 bg-panel2 border border-hair flex items-center justify-center">
      <div class="absolute -top-6 -right-6 w-24 h-24 rounded-full bg-amber/15 blur-2xl"></div>
      <div class="absolute -bottom-8 -left-8 w-28 h-28 rounded-full bg-cyan/15 blur-2xl"></div>
      <svg viewBox="0 0 32 32" class="absolute top-3 left-3 w-5 h-5 opacity-90">
        <rect x="2" y="4" width="4.4" height="24" rx="2.2" fill="#8B5FA6"/>
        <rect x="8.4" y="2" width="4.4" height="26" rx="2.2" fill="#EC4899"/>
        <rect x="14.8" y="1" width="4.4" height="27" rx="2.2" fill="#F4B400"/>
        <rect x="21.2" y="2" width="4.4" height="26" rx="2.2" fill="#7CB518"/>
        <rect x="27.6" y="4" width="2.4" height="24" rx="1.2" fill="#E64545"/>
      </svg>
      <p class="text-sand font-black text-sm relative z-10 text-center px-6 leading-relaxed">
        بوابتك الموثقة لكل نشاط تجاري سعودي<br><span class="text-amber">في مكان واحد</span>
      </p>
    </div>

    <div class="relative mb-5">
      <input id="searchInput" oninput="render()" type="text" placeholder="ابحث عن متجر أو خدمة..."
        class="w-full bg-panel2 border border-hair rounded-xl py-3 pr-11 pl-4 text-sand text-[13px] placeholder:text-muted focus:outline-none focus:ring-1" style="--tw-ring-color:var(--amber)">
      <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-muted">${icon('search','w-4 h-4')}</span>
    </div>

    <p class="text-muted text-[11px] font-bold mb-2 tracking-wide">الأقسام الرئيسية</p>
    <div class="grid grid-cols-2 gap-3">
      ${items.map((k,i)=> tile(CATS[k].title, CATS[k].icon, `openCat('${k}')`, i, CATS[k].subs? CATS[k].subs.length+' أقسام فرعية':'')).join('')}
    </div>
    ${items.length===0? `<p class="text-muted text-xs text-center mt-8">لا توجد نتائج مطابقة</p>`:''}
  </div>`;
}
function openCat(key){
  const cat = CATS[key];
  if(cat.subs) push({type:'cat', key});
  else if(key==='contact') push({type:'contact'});
  else if(key==='elite') push({type:'featured'});
  else push({type:'leaf', title:cat.title});
}

function screenCat(key){
  const cat = CATS[key];
  return `
  <div class="fade-in">
    <p class="text-muted text-[11px] mb-3">${cat.subs.length} قسم فرعي داخل ${cat.title}</p>
    <div class="grid grid-cols-2 gap-3">
      ${cat.subs.map((s,i)=> tile(s.title, s.icon, `openSub('${s.id}','${s.title.replace(/'/g,"")}')`, i)).join('')}
    </div>
  </div>`;
}
function openSub(id, title){
  if(id==='phones') push({type:'storelist', title});
  else push({type:'leaf', title});
}

function screenStoreList(title){
  return `
  <div class="fade-in space-y-3">
    <p class="text-muted text-[11px] mb-1">${PHONE_STORES.length} أنشطة مسجّلة في هذا القسم</p>
    ${PHONE_STORES.map(storeCard).join('')}
  </div>`;
}

function screenFeatured(){
  const sorted = [...PHONE_STORES].sort((a,b)=>b.visitors-a.visitors);
  return `
  <div class="fade-in space-y-3">
    <div class="flex items-center gap-2 mb-1 text-amber">
      ${icon('star','w-4 h-4')}<p class="text-[11px] font-bold">الأكثر تفاعلاً هذا الأسبوع</p>
    </div>
    ${sorted.map(storeCard).join('')}
  </div>`;
}

let activeTab = 'about';
function screenStoreDetail(id){
  const store = PHONE_STORES.find(s=>s.id===id) || PHONE_STORES[0];
  const about = store.about || `في ${store.name} نحرص على تقديم أفضل الأجهزة والملحقات بجودة عالية وأسعار تنافسية، مع خدمة عملاء تلبي احتياجات زوارنا في ${store.region}.`;
  const tabs = [['about','من نحن'],['services','الخدمات'],['activity','النشاط'],['license','الرخصة']];
  return `
  <div class="fade-in">
    <div class="h-28 rounded-2xl bg-panel2 border border-hair relative overflow-hidden flex items-center justify-center mb-4">
      <div class="absolute -top-8 -left-8 w-24 h-24 rounded-full bg-amber/15 blur-2xl"></div>
      <span class="text-4xl font-black" style="color:${SPINES[store.id % SPINES.length]}">${store.name.trim()[0]}</span>
    </div>
    <div class="flex items-start justify-between mb-4">
      <div>
        <h3 class="text-sand font-extrabold text-[15px]">${store.name}</h3>
        <span class="inline-block mt-1.5 text-[10px] bg-panel2 border border-hair text-cyan rounded-full px-2.5 py-1">متاجر الجوالات</span>
      </div>
      <span class="stamp rounded-full w-12 h-12 flex flex-col items-center justify-center text-amber shrink-0">
        <span class="text-[11px] font-black leading-none">${store.visitors}</span>
        <span class="text-[7px] text-muted leading-none mt-0.5">زائر</span>
      </span>
    </div>

    <div class="flex items-center gap-5 border-b border-hair mb-4 overflow-x-auto">
      ${tabs.map(([id,label])=>`
        <button onclick="activeTab='${id}';render()" class="tab-underline ${activeTab===id?'active text-sand':'text-muted'} text-[12.5px] font-bold pb-2.5 whitespace-nowrap">${label}</button>
      `).join('')}
    </div>

    <div class="bg-panel2 rounded-2xl border border-hair p-4">
      ${activeTab==='about'
        ? `<p class="text-sand/90 text-[12.5px] leading-loose">${about}</p>`
        : `<div class="text-center py-6">
             <p class="text-muted text-[12px]">لا تتوفر بيانات إضافية لهذا القسم حالياً</p>
           </div>`}
    </div>
  </div>`;
}

function screenLeaf(title){
  return `
  <div class="fade-in flex flex-col items-center text-center pt-10 gap-4">
    <div class="w-16 h-16 rounded-2xl bg-panel2 border border-hair flex items-center justify-center text-cyan">
      ${icon('sparkle','w-7 h-7')}
    </div>
    <div>
      <p class="text-sand font-extrabold text-[14px]">${title}</p>
      <p class="text-muted text-[12px] mt-2 leading-relaxed max-w-[240px]">لم تتم إضافة أنشطة في هذا القسم بعد. كن أول من يعرّف زوار الدليل بنشاطك التجاري.</p>
    </div>
    <button class="glow-amber bg-panel2 border border-hair text-amber text-[12.5px] font-bold rounded-xl px-5 py-2.5">
      أضف نشاطك التجاري
    </button>
  </div>`;
}

function screenContact(){
  const rows = [
    ['phone','اتصل بنا','+966 5X XXX XXXX'],
    ['mail','راسلنا','support@dalil.sa'],
    ['pin','موقعنا','الرياض، المملكة العربية السعودية'],
  ];
  return `
  <div class="fade-in space-y-3">
    ${rows.map(([ic,l,v])=>`
      <div class="bg-panel2 rounded-2xl border border-hair p-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-ink/60 flex items-center justify-center text-amber">${icon(ic,'w-4.5 h-4.5')}</div>
        <div>
          <p class="text-sand text-[12.5px] font-bold">${l}</p>
          <p class="text-muted text-[11.5px] mt-0.5" dir="ltr">${v}</p>
        </div>
      </div>`).join('')}
  </div>`;
}

function screenInfo(){
  return `
  <div class="fade-in">
    <div class="rounded-2xl bg-panel2 border border-hair h-24 flex items-center justify-center mb-5 text-muted">
      ${icon('video','w-6 h-6')}
    </div>
    <div class="grid grid-cols-3 gap-3">
      ${INFO_ITEMS.map((it,i)=> `
        <button onclick="${it.id==='vision' ? "push({type:'vision'})" : `push({type:'leaf', title:'${it.title}'})`}" class="card-tile spine-${i%5} bg-panel2 rounded-2xl border border-hair py-4 flex flex-col items-center gap-2">
          <span style="color:${SPINES[i%5]}">${icon(it.icon,'w-5 h-5')}</span>
          <span class="text-sand text-[11px] font-bold text-center leading-tight">${it.title}</span>
        </button>`).join('')}
    </div>
  </div>`;
}

function screenVision(){
  const bullets = [
    'توفير حلول تسويق رقمية متقدمة ومبتكرة.',
    'توفير موقع افتراضي يلتقي فيه العميل ومقدم الخدمة في مكان واحد.',
    'إشراك العميل في تحسين جودة المتاجر من خلال تجربته مع مقدم الخدمة، وإبداء رأيه بالمتجر وتقييمه بالنجمات.',
    'مساعدة المتاجر على تحسين جودة الخدمة لديهم من خلال المنافسة في تقديم الأفضل.',
    'ابتكار طرق ذكية بالتسويق من خلال منصات التواصل الاجتماعي والبث المباشر من خلالها.',
    'نحن نؤمن بأن نجاح مقدم الخدمة بالدليل الرقمي هو نجاح لنا.',
  ];
  return `
  <div class="fade-in">
    <div class="bg-panel2 rounded-2xl border border-hair p-4 mb-4">
      <p class="text-sand text-[13px] leading-loose font-bold">
        نحن نؤمن بأن التسويق الرقمي هو مفتاح النجاح في عالم التجارة، بعد توفيق الله تعالى.
      </p>
    </div>
    <div class="bg-panel2 rounded-2xl border border-hair p-4 mb-4">
      <p class="text-sand/90 text-[12.5px] leading-loose">
        رؤيتنا هي توفير تجربة تسويق ذكية ممتعة ومفيدة للمستفيد ومقدم الخدمة من خلال تطبيق يجمعهم في مكان واحد، ونهدف إلى أن نصبح من الرائدين في مجال خدمة التسويق الرقمي من خلال:
      </p>
    </div>
    <div class="space-y-2.5">
      ${bullets.map((b,i)=>`
        <div class="bg-panel2 rounded-2xl border border-hair p-3.5 flex items-start gap-3 spine-${i%5}">
          <span class="w-1.5 h-1.5 rounded-full mt-1.5 shrink-0" style="background:${SPINES[i%5]}"></span>
          <p class="text-sand/90 text-[12.5px] leading-relaxed">${b}</p>
        </div>`).join('')}
    </div>
  </div>`;
}

function screenLive(){
  return `
  <div class="fade-in flex flex-col items-center text-center pt-14 gap-4">
    <div class="w-16 h-16 rounded-full bg-panel2 border border-hair flex items-center justify-center text-red-400">
      <span class="live-dot w-3 h-3 rounded-full bg-red-500 block"></span>
    </div>
    <p class="text-sand font-extrabold text-[14px]">لا يوجد بث مباشر حالياً</p>
    <p class="text-muted text-[12px] max-w-[230px] leading-relaxed">تابع هذه الصفحة لمشاهدة فعاليات وعروض المتاجر المباشرة أول بأول.</p>
  </div>`;
}

function screenMore(){
  const rows = ['حسابي','الإشعارات','المفضلة','الإعدادات','لغة التطبيق','عن التطبيق','تسجيل الخروج'];
  return `
  <div class="fade-in space-y-2">
    ${rows.map(r=>`
      <button class="w-full flex items-center justify-between bg-panel2 border border-hair rounded-xl px-4 py-3.5 text-sand text-[13px] font-bold">
        ${r}
        <span class="text-muted rotate-180">${icon('chevron','w-4 h-4')}</span>
      </button>`).join('')}
  </div>`;
}

/* ---------------- render ---------------- */
const titles = { home:'الرئيسية', info:'معلومات الدليل', live:'البث المباشر', more:'المزيد', contact:'تواصل معنا', featured:'المتميزون', vision:'رؤيتنا' };
function render(){
  const s = current();
  const el = document.getElementById('screen');
  const backBtn = document.getElementById('backBtn');
  backBtn.classList.toggle('hidden', stack.length<=1);
  backBtn.classList.toggle('flex', stack.length>1);

  let html = '', title = '';
  if(s.type==='home'){ html = screenHome(); title = titles.home; }
  else if(s.type==='cat'){ html = screenCat(s.key); title = CATS[s.key].title; }
  else if(s.type==='storelist'){ html = screenStoreList(s.title); title = s.title; }
  else if(s.type==='storedetail'){ html = screenStoreDetail(s.id); title = 'ملف النشاط'; }
  else if(s.type==='leaf'){ html = screenLeaf(s.title); title = s.title; }
  else if(s.type==='vision'){ html = screenVision(); title = titles.vision; }
  else if(s.type==='contact'){ html = screenContact(); title = titles.contact; }
  else if(s.type==='featured'){ html = screenFeatured(); title = titles.featured; }
  else if(s.type==='info'){ html = screenInfo(); title = titles.info; }
  else if(s.type==='live'){ html = screenLive(); title = titles.live; }
  else if(s.type==='more'){ html = screenMore(); title = titles.more; }

  el.innerHTML = html;
  document.getElementById('screenTitle').textContent = title;

  document.querySelectorAll('[data-nav]').forEach(b=>{
    const active = stack.length===1 && stack[0].type===b.dataset.nav;
    b.classList.toggle('text-sand', active);
    b.classList.toggle('text-muted', !active);
    b.querySelectorAll('svg').forEach(sv=> sv.style.color = active? (b.dataset.nav==='home'? 'var(--sand)':'var(--amber)') : '');
  });
}

/* ---------------- clock + visitor ticker ---------------- */
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',hour12:false});
}
tickClock(); setInterval(tickClock, 30000);

render();
</script>
</body>
</html>
